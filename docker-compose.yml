name: ecommerce-platform

x-api-environment: &api-environment
  APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env, run make env to generate one}@db:5432/${POSTGRES_DB:-ecommerce}
  APP_LOG_FORMAT: json
  APP_LOG_LEVEL: INFO

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env, run make env to generate one}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build: ./backend
    image: ecommerce-platform-api:local
    environment:
      <<: *api-environment
      APP_CORS_ORIGINS: http://localhost:${WEB_PORT:-8080},http://localhost:5173
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - media:/var/lib/ecommerce/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  migrate:
    image: ecommerce-platform-api:local
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: ./frontend
    image: ecommerce-platform-web:local
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - media:/usr/share/nginx/media:ro
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  seed:
    image: ecommerce-platform-api:local
    pull_policy: never
    profiles: ["seed"]
    command:
      - sh
      - -c
      - ecommerce import-products /data/products-sample.csv && ecommerce import-images /data/images
    environment: *api-environment
    volumes:
      - ./data:/data:ro
      - media:/var/lib/ecommerce/media
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
  media:
