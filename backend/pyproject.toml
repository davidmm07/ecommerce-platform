[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ecommerce-platform-api"
version = "1.0.0"
description = "E-commerce platform API: catalog, CSV import, search and checkout with FastAPI and PostgreSQL."
requires-python = ">=3.13"
authors = [{ name = "David Morales" }]
dependencies = [
  "alembic>=1.16",
  "asyncpg>=0.30",
  "boto3>=1.40",
  "fastapi>=0.120",
  "httpx>=0.28",
  "pillow>=12.0",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0.40",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "import-linter>=2.3",
  "moto[s3]>=5.1",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "testcontainers[postgres]>=4.12",
]

[project.scripts]
ecommerce = "ecommerce.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: requires a PostgreSQL database"]

[tool.coverage.run]
source = ["ecommerce"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "C4", "DTZ", "PT", "RET", "SIM", "RUF", "ASYNC", "PL", "PERF"]
ignore = ["N818", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915", "PLR0917", "ASYNC240"]
"migrations/**" = ["S608"]
"src/ecommerce/infrastructure/persistence/models.py" = ["RUF012"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["ecommerce"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "boto3.*", "botocore.*", "moto.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.importlinter]
root_package = "ecommerce"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependency rule: source code dependencies point inwards"
type = "layers"
layers = [
  "ecommerce.cli | ecommerce.presentation",
  "ecommerce.container",
  "ecommerce.infrastructure",
  "ecommerce.application",
  "ecommerce.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application stay framework agnostic"
type = "forbidden"
source_modules = ["ecommerce.domain", "ecommerce.application"]
forbidden_modules = ["fastapi", "starlette", "pydantic", "pydantic_settings", "sqlalchemy", "asyncpg", "alembic", "uvicorn", "PIL", "boto3", "botocore"]

[[tool.importlinter.contracts]]
name = "Bounded contexts in the domain are independent"
type = "independence"
modules = ["ecommerce.domain.catalog", "ecommerce.domain.ordering", "ecommerce.domain.payments"]
